<!DOCTYPE html>
<html>
<head>
  <!-- The customer site rewrites public routes to /flutter/index.html. Keep
       every generated asset under that stable static prefix. -->
  <base href="/flutter/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Chat, connect, create, and tip on ChatAndTip.">
  <meta name="theme-color" content="#000000">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ChatAndTip">
  <link rel="apple-touch-icon" href="assets/assets/icons/chatandtiplogo.jpg">

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="assets/assets/icons/chatandtiplogo.jpg"/>

  <title>ChatAndTip</title>
  <script src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js" async defer></script>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Remove service workers from earlier Flutter builds. They can otherwise
    // keep serving an old main.dart.js even after a successful deployment.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((registrations) => {
        for (const registration of registrations) registration.unregister();
      });
    }
  </script>
  <script src="flutter_bootstrap.js?v=20261110-2040" async></script>
</body>
</html>
